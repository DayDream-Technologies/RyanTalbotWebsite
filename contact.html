<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', sans-serif;
            background: linear-gradient(to bottom, #fafafa, #f5f5f5);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        #coaching-form-container {
            max-width: 900px;
            width: 100%;
            padding: 40px;
            background: #fafafa;
            border-left: 4px solid #006400;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 10px;
            text-align: center;
        }

        p {
            font-size: 16px;
            color: #555;
            text-align: center;
            margin-bottom: 30px;
        }

        #successMessage {
            display: none;
            background-color: #d1fae5;
            color: #065f46;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #1a1a1a;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            font-size: 16px;
            font-family: inherit;
            transition: border-color 0.3s ease;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #006400;
            box-shadow: 0 0 0 3px rgba(0, 100, 0, 0.1);
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #006400;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        button:hover {
            background-color: #004d00;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div id="coaching-form-container">
        <h1>Get in Touch</h1>
        <p>Reach out for coaching inquiries or dietary guidance</p>

        <div id="successMessage">
            Thank you! Your message has been sent successfully. We'll be in touch soon.
        </div>

        <form id="coachingForm" action="https://api.web3forms.com/submit" method="POST">
            <input type="hidden" name="access_key" value="6ccfcd2d-fd84-4ebc-b965-73ca758fcd6b">

            <div class="form-group">
                <label for="coach-name">Your Name *</label>
                <input type="text" id="coach-name" name="name" required>
            </div>

            <div class="form-group">
                <label for="coach-email">Your Email *</label>
                <input type="email" id="coach-email" name="email" required>
            </div>

            <div class="form-group">
                <label for="coach-message">What are your coaching and/or dietary goals? *</label>
                <textarea id="coach-message" name="message" required></textarea>
            </div>

            <button type="submit">Send Message</button>
        </form>
    </div>

    <script>
        // Handle coaching form submission
        document.getElementById('coachingForm').addEventListener('submit', function(e) {
            e.preventDefault();

            // Get form data
            const formData = new FormData(this);

            // Submit to Web3Forms
            fetch('https://api.web3forms.com/submit', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    // Show success message
                    document.getElementById('successMessage').style.display = 'block';

                    // Reset form
                    document.getElementById('coachingForm').reset();

                    // Hide success message after 5 seconds
                    setTimeout(() => {
                        document.getElementById('successMessage').style.display = 'none';
                    }, 5000);

                    // Scroll to success message
                    document.getElementById('successMessage').scrollIntoView({ behavior: 'smooth' });
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('There was an error sending your message. Please try again.');
            });
        });
    </script>
</body>
</html>
